# Pings the Supabase database every 3 days so the free project never pauses (it pauses after 7 days of no activity).
# Setup: GitHub repo > Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_URL = https://YOUR-PROJECT.supabase.co        (same as in config.js)
#   SUPABASE_KEY = your publishable (anon) key             (same as in config.js)
name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"   # every 3 days at 03:17 UTC
  workflow_dispatch:          # lets you press "Run workflow" to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_KEY secret"; exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/members?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          # 200 = database answered. Anything else fails the job, so GitHub emails you.
          [ "$code" = "200" ]
