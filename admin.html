<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Members</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a24;--mute:#5f6d66;--line:#d5dbd6;--accent:#1f5f4a;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1c2420;--ink:#e8eee9;--mute:#9aa8a0;--line:#33403a;--accent:#5fbf9a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Georgia,serif}
main{max-width:1150px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:.3em 0 .6em}
input,select,button{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{background:var(--accent);color:#fff;border:0;font-weight:bold;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0b1410}}
button.plain{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:normal}
button.del{background:var(--err);color:#fff}
button.sm{padding:5px 10px;font-size:.9rem}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#login{max-width:340px;display:grid;gap:10px}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
#bar .sp{flex:1}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:880px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--bg)}
td img{width:48px;height:48px;object-fit:cover;border-radius:6px;display:block}
td.act{white-space:nowrap}
.err{color:var(--err);font-weight:bold}
#count{color:var(--mute)}
[hidden]{display:none!important}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(460px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-weight:bold;margin:10px 0 3px}
dialog input,dialog select{width:100%}
dialog small{color:var(--mute)}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1}
input,select{font-size:16px}button{min-height:40px}
dialog{max-height:92vh;overflow-y:auto}
@media (max-width:700px){
 main{padding:12px 10px 40px}
 #bar>*{flex:1 1 100%}#bar select{flex:1 1 calc(50% - 4px)}#count{order:-1;font-size:1.15rem;font-weight:bold;color:var(--ink)}#bar #csv,#bar #zip{flex:1 1 calc(50% - 4px)}#bar .sp{display:none}
 .wrap{border:0;background:none;overflow:visible}
 table,thead,tbody,tr,td{display:block;min-width:0;width:100%}
 thead{display:none}
 tr{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;padding:8px 12px}
 td{border:0;padding:5px 0;display:flex;gap:10px;justify-content:space-between;text-align:right}
 td::before{content:attr(data-label);font-weight:bold;color:var(--mute);text-align:left}
 td.ph{justify-content:center}td.ph::before,td.act::before{display:none}
 td img{width:96px;height:96px}
 td.act{gap:8px}td.act button{flex:1;min-height:44px}
}
.badge{background:var(--accent);color:#fff;border-radius:99px;padding:1px 8px;font-size:.75rem;margin-left:6px}
@media (prefers-color-scheme:dark){.badge{color:#0b1410}}
.pill{border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px;color:var(--mute)}
#oc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 16px 12px}
#oc h2{font-size:1.15rem;margin:14px 0 4px}#oc ul{margin:0;padding-left:18px}
</style>
</head>
<body>
<main>
<h1>Members – Admin</h1>

<form id="login">
  <input id="email" type="email" placeholder="Admin email" required autocomplete="username">
  <input id="pass" type="password" placeholder="Password" required autocomplete="current-password">
  <button type="submit">Log in</button>
  <div id="lerr" class="err"></div>
</form>

<section id="panel" hidden>
  <div id="bar">
    <select id="fc"><option value="">All centers</option></select>
    <select id="ft"><option value="">All registrants</option><option value="m">Regular Members</option><option value="o">Area 4 Officers Only</option></select>
    <select id="fcat"><option value="">All categories</option></select>
    <select id="fpos"><option value="">All positions</option></select>
    <select id="fv"><option value="t">Table view</option><option value="c">Officers by Center</option></select>
    <input id="q" type="search" placeholder="Search name…">
    <span id="count"></span>
    <span class="sp"></span>
    <button id="ref" type="button" class="plain">Refresh</button>
    <button id="csv" type="button">Download CSV</button>
    <button id="xls" type="button">Download Excel</button>
    <button id="zip" type="button">Download Photos (ZIP)</button>
    <button id="out" type="button" class="plain">Log out</button>
  </div>
  <div id="oc" hidden></div>
  <div class="wrap" id="tw">
    <table>
      <thead><tr><th>Photo</th><th>Name</th><th>Category</th><th>Civil status</th><th>Center</th><th>Status</th><th>Age</th><th>Position</th><th>Spiritual gift</th><th>Registered</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>
</main>

<dialog id="dlg">
  <form id="ef">
    <h2 style="margin:0 0 4px;font-size:1.2rem">Edit member</h2>
    <label for="e_first">First name</label><input id="e_first" required maxlength="60">
    <label for="e_mid">Middle name</label><input id="e_mid" maxlength="60">
    <label for="e_last">Last name (with suffix)</label><input id="e_last" required maxlength="70">
    <label for="e_dob">Date of birth</label><input id="e_dob" type="date">
    <label for="e_gender">Gender</label><select id="e_gender"></select>
    <label for="e_civil">Civil status</label><select id="e_civil"></select>
    <label for="e_cat">Category</label><select id="e_cat"></select>
    <label for="e_center">Center</label><select id="e_center" required></select>
    <label for="e_status">Status</label><select id="e_status"></select>
    <label for="e_age">Age</label><input id="e_age" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" required>
    <label for="e_pos">Position</label><input id="e_pos" maxlength="80">
    <label for="e_gift">Spiritual gift</label><input id="e_gift" maxlength="80">
    <label for="e_phone">Contact number</label><input id="e_phone" maxlength="20">
    <label for="e_email">Email</label><input id="e_email" type="email" maxlength="120">
    <label for="e_addr">Address</label><input id="e_addr" maxlength="200">
    <label class="chk"><input id="e_off" type="checkbox" style="width:auto"> Area 4 Officer</label>
    <div id="e_ofs" hidden>
      <small>The Center above is the assigned center.</small>
      <label for="e_opos">Officer position</label><select id="e_opos"></select>
      <label for="e_ts">Term start</label><input id="e_ts" type="date">
      <label for="e_te">Term end</label><input id="e_te" type="date">
      <label for="e_com">Committee / role</label><input id="e_com" maxlength="120">
    </div>
    <label for="e_photo">Change photo</label>
    <input id="e_photo" type="file" accept="image/*">
    <small>Leave empty to keep the current photo. Max 2 MB.</small>
    <div id="eerr" class="err" role="alert"></div>
    <div class="btns">
      <button id="esave" type="submit">Save changes</button>
      <button id="ecancel" type="button" class="plain">Cancel</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const CFG = window.APP_CONFIG || {};
if (!CFG.url || CFG.url.includes("YOUR-")) document.body.insertAdjacentHTML("afterbegin", '<p style="padding:12px;color:#b3261e;font-weight:bold">Setup incomplete: open config.js and paste your Supabase URL and key.</p>');
const db = supabase.createClient(CFG.url || "https://invalid.invalid", CFG.key || "x");
const $ = id => document.getElementById(id);
const CENTERS = ["Puon ti Biag","Damasco","Ti libro a naselloan","Eufrates","Baro Jerusalem","Pergamo","Patmos","Raniag ti lawag","Galilea","Tesalonica","Galacia","Baro a langit","Getsimani"];
const STATUSES = ["Student","Working","Not working","Other"];
const TYPES = {"image/jpeg":"jpg","image/png":"png","image/webp":"webp"};
const MAX = 2 * 1024 * 1024;
CENTERS.forEach(c => { $("fc").add(new Option(c, c)); $("e_center").add(new Option(c, c)); });
const CIVIL = ["Single","Married","Separated","Widow (Woman)","Widower (Man)"];
const CATS = ["Junior FYS","Senior FYS","Katandaan"];
const POS = ["President","Vice President","Secretary","Treasurer","Auditor","P.R.O.","Board Member"];
[["e_status",STATUSES],["e_gender",["Male","Female"]],["e_civil",CIVIL],["e_cat",CATS],["e_opos",POS]].forEach(([id, a]) => { $(id).add(new Option("—", "")); a.forEach(v => $(id).add(new Option(v, v))); });
CATS.forEach(c => $("fcat").add(new Option(c, c))); POS.forEach(c => $("fpos").add(new Option(c, c)));
$("e_off").onchange = () => { $("e_ofs").hidden = !$("e_off").checked; };
function ageOf(dob){ const d = new Date(dob + "T00:00:00"), n = new Date(); if (!dob || isNaN(d) || d > n) return null;
  let a = n.getFullYear() - d.getFullYear(); if (n.getMonth() < d.getMonth() || (n.getMonth() === d.getMonth() && n.getDate() < d.getDate())) a--; return a; }
// Marriage/widowhood override: a non-Single person under 30 recorded as Katandaan
function override(m){ return m.civil_status && m.civil_status !== "Single" && m.category === "Katandaan" && m.age != null && m.age < 30
  ? `<small class="pill">${m.civil_status === "Married" ? "married override" : "marital status override"}</small>` : ""; }
let all = [], urls = {}, editing = null;

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function setSel(sel, val){
  if (val && ![...sel.options].some(o => o.value === val)) sel.add(new Option(val, val));
  sel.value = val || "";
}

async function load(){
  $("count").textContent = "Loading…";
  try {
    let rows = [], from = 0;
    while (true) {
      const r = await db.from("members").select("*").order("created_at", {ascending:false}).range(from, from + 999);
      if (r.error) {
        if (/jwt|token|auth/i.test(r.error.message)) { show(false); $("lerr").textContent = "Session expired. Please log in again."; return; }
        throw r.error;
      }
      rows = rows.concat(r.data);
      if (r.data.length < 1000) break;
      from += 1000;
    }
    all = rows; urls = {};
    const o = await db.from("area4_officers").select("*");   // per-center officer terms; active term preferred
    all.forEach(m => m.off = null);
    (o.data || []).forEach(x => { const m = all.find(y => y.id === x.member_id); if (m && (!m.off || !x.term_end)) m.off = x; });
    const paths = all.map(m => m.photo_path).filter(Boolean);
    for (let i = 0; i < paths.length; i += 100) {
      const s = await db.storage.from("member-photos").createSignedUrls(paths.slice(i, i + 100), 3600);
      (s.data || []).forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; });
    }
    render();
  } catch (err) {
    console.error(err);
    $("count").textContent = "Could not load. Check your internet, then refresh.";
  }
}

// Every export uses filtered(), so exports always respect Type/Category/Position/Center/search
function filtered(){
  const c = $("fc").value, q = $("q").value.trim().toLowerCase(), t = $("ft").value, g = $("fcat").value, p = $("fpos").value;
  return all.filter(m => (!c || m.center === c) && (!q || (m.full_name || "").toLowerCase().includes(q))
    && (!t || (t === "o") === !!m.is_officer) && (!g || m.category === g) && (!p || (m.off && m.off.position === p)));
}

function render(){
  const oc = $("fv").value === "c", list = oc ? filtered().filter(m => m.off) : filtered();
  $("count").textContent = list.length + (oc ? " officer" : " member") + (list.length === 1 ? "" : "s") + (!oc && list.length !== all.length ? " (of " + all.length + " total)" : "");
  $("tw").hidden = oc; $("oc").hidden = !oc;
  if (oc) return renderOfficers(list);
  $("rows").innerHTML = list.length ? list.map(m => `<tr>
    <td class="ph">${urls[m.photo_path] ? `<a href="${urls[m.photo_path]}" target="_blank" rel="noopener"><img loading="lazy" src="${urls[m.photo_path]}" alt="Photo of ${esc(m.full_name)}"></a>` : ""}</td>
    <td data-label="Name">${esc(m.full_name)}${m.is_officer ? '<span class="badge">Officer</span>' : ""}</td>
    <td data-label="Category">${esc(m.category)}${override(m)}</td><td data-label="Civil status">${esc(m.civil_status)}</td>
    <td data-label="Center">${esc(m.center)}</td>
    <td data-label="Status">${esc(m.status)}</td><td data-label="Age">${m.age ?? ""}</td>
    <td data-label="Position">${esc(posOf(m))}</td><td data-label="Spiritual gift">${esc(giftOf(m))}</td>
    <td data-label="Registered">${new Date(m.created_at).toLocaleDateString()}</td>
    <td class="act"><button type="button" class="plain sm" data-act="edit" data-id="${m.id}">Edit</button>
      <button type="button" class="del sm" data-act="del" data-id="${m.id}">Delete</button></td></tr>`).join("")
    : '<tr><td colspan="11">No members found.</td></tr>';
}
function renderOfficers(list){
  const g = {};
  list.forEach(m => (g[m.off.center || m.center] = g[m.off.center || m.center] || []).push(m));
  const cs = Object.keys(g).sort();
  $("oc").innerHTML = cs.length ? cs.map(c => `<h2>${esc(c)}</h2><ul>` + g[c].sort((a, b) => POS.indexOf(a.off.position) - POS.indexOf(b.off.position))
    .map(m => `<li><b>${esc(m.off.position)}</b> — ${esc(m.full_name)}${m.off.term_end ? " <small>(term ended)</small>" : ""}</li>`).join("") + "</ul>").join("")
    : "<p>No officers found.</p>";
}

$("rows").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const m = all.find(x => x.id === b.dataset.id); if (!m) return;
  if (b.dataset.act === "edit") openEdit(m); else removeMember(m);
});

async function removeMember(m){
  if (!confirm("Delete " + m.full_name + "?\nThis also removes the photo and cannot be undone.")) return;
  const r = await db.from("members").delete().eq("id", m.id).select();
  if (r.error || !r.data.length) { alert("Could not delete: " + (r.error ? r.error.message : "not allowed. Run add-edit-delete.sql in Supabase.")); return; }
  if (m.photo_path) await db.storage.from("member-photos").remove([m.photo_path]);
  await load();
}

function openEdit(m){
  editing = m; $("eerr").textContent = ""; $("e_photo").value = "";
  const p = (m.full_name || "").split(" "), o = m.off || {};
  $("e_first").value = m.first_name ?? p[0] ?? ""; $("e_mid").value = m.middle_name || ""; $("e_last").value = m.last_name ?? p.slice(1).join(" ");
  $("e_dob").value = m.date_of_birth || ""; setSel($("e_gender"), m.gender); setSel($("e_civil"), m.civil_status); setSel($("e_cat"), m.category);
  setSel($("e_center"), m.center); setSel($("e_status"), m.status);
  $("e_age").value = m.age ?? ""; $("e_pos").value = posOf(m); $("e_gift").value = m.spiritual_gift || "";
  $("e_phone").value = m.contact_number || ""; $("e_email").value = m.email || ""; $("e_addr").value = m.address || "";
  $("e_off").checked = !!m.is_officer; $("e_ofs").hidden = !m.is_officer;
  setSel($("e_opos"), o.position); $("e_ts").value = o.term_start || ""; $("e_te").value = o.term_end || ""; $("e_com").value = o.committee || "";
  $("dlg").showModal();
}
$("e_age").addEventListener("input", () => { $("e_age").value = $("e_age").value.replace(/\D/g, "").slice(0, 3); });
$("ecancel").onclick = () => $("dlg").close();

$("ef").addEventListener("submit", async e => {
  e.preventDefault(); $("esave").disabled = true; $("eerr").textContent = "";
  try {
    const dob = $("e_dob").value || null; let ageNum = parseInt($("e_age").value, 10);
    if (dob && ageOf(dob) != null) ageNum = ageOf(dob);
    if (!(ageNum >= 1 && ageNum <= 120)) throw new Error("Please enter a valid age (1 to 120).");
    const first = $("e_first").value.trim(), mid = $("e_mid").value.trim(), last = $("e_last").value.trim();
    if (!first || !last) throw new Error("First and last name are required.");
    const isOff = $("e_off").checked;
    if (isOff && (!$("e_opos").value || !$("e_ts").value)) throw new Error("Officers need a position and a term start.");
    // Officer row first, so a per-center uniqueness failure stops the save before anything else changes
    if (isOff) {
      const o = {center: $("e_center").value, position: $("e_opos").value, term_start: $("e_ts").value || null, term_end: $("e_te").value || null, committee: $("e_com").value.trim() || null};
      const r = await (editing.off ? db.from("area4_officers").update(o).eq("id", editing.off.id) : db.from("area4_officers").insert({...o, member_id: editing.id}));
      if (r.error) throw new Error(r.error.code === "23505" ? "Another active " + o.position + " already exists at " + o.center + "." : r.error.message);
    } else if (editing.off) {
      const r = await db.from("area4_officers").delete().eq("member_id", editing.id); if (r.error) throw r.error;
    }
    let photo_path = editing.photo_path, oldPath = null;
    const file = $("e_photo").files[0];
    if (file) {
      if (file.size > MAX) throw new Error("Photo is larger than 2 MB.");
      if (!TYPES[file.type]) throw new Error("Photo must be JPG, PNG or WebP.");
      const np = ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)) + "." + TYPES[file.type];
      const up = await db.storage.from("member-photos").upload(np, file, {contentType: file.type});
      if (up.error) throw up.error;
      oldPath = editing.photo_path; photo_path = np;
    }
    const r = await db.from("members").update({
      first_name: first, middle_name: mid || null, last_name: last, full_name: [first, mid, last].filter(Boolean).join(" "),
      date_of_birth: dob, gender: $("e_gender").value || null, civil_status: $("e_civil").value || null, category: $("e_cat").value || null,
      center: $("e_center").value, status: $("e_status").value || null, age: ageNum, is_officer: isOff,
      position: (isOff && $("e_opos").value) || $("e_pos").value.trim() || "Member",
      spiritual_gift: $("e_gift").value.trim() || "None", contact_number: $("e_phone").value.trim() || null,
      email: $("e_email").value.trim() || null, address: $("e_addr").value.trim() || null, photo_path
    }).eq("id", editing.id).select();
    if (r.error) throw r.error;
    if (!r.data.length) throw new Error("Not allowed. Run add-edit-delete.sql in Supabase.");
    if (oldPath) await db.storage.from("member-photos").remove([oldPath]);
    $("dlg").close(); await load();
  } catch (err) { $("eerr").textContent = "Could not save: " + (err.message || err); }
  finally { $("esave").disabled = false; }
});

function safe(s){ return String(s || "").replace(/[\\/:*?"<>|\x00-\x1f]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 80) || "member"; }
function posOf(m){ return m.position && m.position.trim() && m.position.trim().toLowerCase() !== "none" ? m.position : "Member"; }
function giftOf(m){ return m.spiritual_gift && m.spiritual_gift.trim() ? m.spiritual_gift : "None"; }
function sorted(list){ return [...list].sort((a, b) => (a.center || "").localeCompare(b.center || "") || (a.full_name || "").localeCompare(b.full_name || "")); }
function photoNames(){          // member id -> "Center/Full Name.jpg" (unique)
  const used = new Set(), out = {};
  sorted(all).forEach(m => {
    if (!m.photo_path) return;
    const ext = (m.photo_path.split(".").pop() || "jpg").toLowerCase();
    const base = safe(m.center) + "/" + safe(m.full_name);
    let n = base + "." + ext, i = 2;
    while (used.has(n.toLowerCase())) n = base + " (" + (i++) + ")." + ext;
    used.add(n.toLowerCase()); out[m.id] = n;
  });
  return out;
}
function csvCell(v){
  v = v == null ? "" : String(v);
  if (/^[=+\-@]/.test(v)) v = "'" + v;
  return '"' + v.replace(/"/g, '""') + '"';
}
function tableData(list, names){
  const head = ["No.","Full Name","First Name","Middle Name","Last Name","Date of Birth","Gender","Civil Status","Category","Category Note","Officer","Officer Position","Center","Term Start","Term End","Committee","Status","Age","Position","Spiritual Gift","Contact","Email","Address","Date Registered","Photo File"];
  const fmt = {year:"numeric", month:"short", day:"2-digit", hour:"numeric", minute:"2-digit"};
  const rows = sorted(list).map((m, i) => { const o = m.off || {}; return [i + 1, m.full_name, m.first_name, m.middle_name, m.last_name, m.date_of_birth, m.gender, m.civil_status, m.category,
    override(m) ? (m.civil_status === "Married" ? "married override" : "marital status override") : "", m.is_officer ? "Yes" : "No", o.position, m.center, o.term_start, o.term_end, o.committee,
    m.status, m.age, posOf(m), giftOf(m), m.contact_number, m.email, m.address, new Date(m.created_at).toLocaleString("en-US", fmt), names[m.id] || "No photo"]; });
  return [head, ...rows];
}
function csvText(list, names){ return "\ufeff" + tableData(list, names).map(r => r.map(csvCell).join(",")).join("\r\n"); }
// Excel: an HTML table saved as .xls opens natively in Excel/LibreOffice (no external library needed)
function xlsText(list, names){
  const cell = v => { v = v == null ? "" : String(v); return "<td>" + esc(/^[=+\-@]/.test(v) ? "'" + v : v) + "</td>"; };
  return '<html><head><meta charset="utf-8"></head><body><table border="1">' + tableData(list, names).map(r => "<tr>" + r.map(cell).join("") + "</tr>").join("") + "</table></body></html>";
}
function saveBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
$("csv").onclick = () => saveBlob(new Blob([csvText(filtered(), photoNames())], {type:"text/csv;charset=utf-8"}), "members-" + stamp() + ".csv");

$("zip").onclick = async () => {
  if (!window.JSZip) return alert("The ZIP tool could not load. Check your internet and refresh.");
  const list = filtered(), names = photoNames(), todo = list.filter(m => urls[m.photo_path] && names[m.id]);
  if (!todo.length) return alert("There are no photos in this list.");
  const btn = $("zip"), label = btn.textContent; btn.disabled = true;
  try {
    const zip = new JSZip(), queue = [...todo]; let done = 0, failed = 0;
    const worker = async () => {
      while (queue.length) {
        const m = queue.shift();
        try { const r = await fetch(urls[m.photo_path]); if (!r.ok) throw new Error("http"); zip.file(names[m.id], await r.blob()); }
        catch (_) { failed++; }
        btn.textContent = "Photos " + (++done) + "/" + todo.length;
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    btn.textContent = "Zipping…";
    zip.file("members.csv", csvText(list, names));
    saveBlob(await zip.generateAsync({type:"blob", compression:"STORE"}), "members-photos-" + stamp() + ".zip");
    if (failed) alert(failed + " photo(s) could not be downloaded. Refresh the page and try again.");
  } catch (err) { console.error(err); alert("Could not create the ZIP. Check your internet and try again."); }
  finally { btn.disabled = false; btn.textContent = label; }
};

function show(signedIn){ $("login").hidden = signedIn; $("panel").hidden = !signedIn; if (signedIn) load(); }
$("login").addEventListener("submit", async e => {
  e.preventDefault(); $("lerr").textContent = "";
  const r = await db.auth.signInWithPassword({email:$("email").value, password:$("pass").value});
  if (r.error) $("lerr").textContent = "Login failed: " + r.error.message; else show(true);
});
$("out").onclick = async () => { await db.auth.signOut(); show(false); };
$("ref").onclick = load;
["fc","ft","fcat","fpos","fv"].forEach(id => $(id).onchange = render); $("q").oninput = render;
$("xls").onclick = () => saveBlob(new Blob([xlsText(filtered(), photoNames())], {type:"application/vnd.ms-excel"}), "members-" + stamp() + ".xls");
db.auth.getSession().then(r => show(!!r.data.session));
</script>
