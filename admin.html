<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Members</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a24;--mute:#5f6d66;--line:#d5dbd6;--accent:#1f5f4a;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1c2420;--ink:#e8eee9;--mute:#9aa8a0;--line:#33403a;--accent:#5fbf9a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Georgia,serif}
main{max-width:1150px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:.3em 0 .6em}
input,select,button{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{background:var(--accent);color:#fff;border:0;font-weight:bold;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0b1410}}
button.plain{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:normal}
button.del{background:var(--err);color:#fff}
button.sm{padding:5px 10px;font-size:.9rem}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#login{max-width:340px;display:grid;gap:10px}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
#bar .sp{flex:1}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:880px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--bg)}
td img{width:48px;height:60px;object-fit:cover;object-position:top;border-radius:6px;display:block}
td.act{white-space:nowrap}
.err{color:var(--err);font-weight:bold}
#count{color:var(--mute)}
[hidden]{display:none!important}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(460px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-weight:bold;margin:10px 0 3px}
dialog input,dialog select{width:100%}
dialog small{color:var(--mute)}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1}
input,select{font-size:16px}button{min-height:40px}
dialog{max-height:92vh;overflow-y:auto}
@media (max-width:700px){
 main{padding:12px 10px 40px}
 #bar>*{flex:1 1 100%}#bar select{flex:1 1 calc(50% - 4px)}#count{order:-1;font-size:1.15rem;font-weight:bold;color:var(--ink)}#bar #csv,#bar #zip{flex:1 1 calc(50% - 4px)}#bar .sp{display:none}
 .wrap{border:0;background:none;overflow:visible}
 table,thead,tbody,tr,td{display:block;min-width:0;width:100%}
 thead{display:none}
 tr{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;padding:8px 12px}
 td{border:0;padding:5px 0;display:flex;gap:10px;justify-content:space-between;text-align:right}
 td::before{content:attr(data-label);font-weight:bold;color:var(--mute);text-align:left}
 td.ph{justify-content:center}td.ph::before,td.act::before{display:none}
 td img{width:96px;height:120px}
 td.act{gap:8px}td.act button{flex:1;min-height:44px}
}
.badge{background:var(--accent);color:#fff;border-radius:99px;padding:1px 8px;font-size:.75rem;margin-left:6px}
@media (prefers-color-scheme:dark){.badge{color:#0b1410}}
.pill{border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px;color:var(--mute)}
#oc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 16px 12px}
#oc h2{font-size:1.15rem;margin:14px 0 4px}#oc ul{margin:0;padding-left:18px}
.chk{display:flex;gap:8px;align-items:center;font-weight:normal;cursor:pointer}
td.sel input{width:22px;height:22px;min-height:0;padding:0}
.nophoto{color:var(--mute);font-size:.85rem}
#e_prev{display:block;width:120px;height:auto;max-height:160px;object-fit:contain;margin:6px 0;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
fieldset.lv{border:0;padding:0;margin:10px 0 0}fieldset.lv legend{font-weight:bold;padding:0}
</style>
</head>
<body>
<main>
<h1>Members – Admin</h1>

<form id="login">
  <input id="email" type="email" placeholder="Admin email" required autocomplete="username">
  <input id="pass" type="password" placeholder="Password" required autocomplete="current-password">
  <label class="chk"><input id="showpw" type="checkbox" style="width:auto;min-height:0"> Show password</label>
  <button type="submit">Log in</button>
  <div id="lerr" class="err"></div>
</form>

<section id="panel" hidden>
  <div id="bar">
    <select id="fc"><option value="">All centers</option></select>
    <select id="ft"><option value="">All registrants</option><option value="m">Regular Members</option><option value="o">Area 4 Officers Only</option></select>
    <select id="fcat"><option value="">All categories</option></select>
    <select id="fpos"><option value="">All positions</option></select>
    <select id="fv"><option value="t">Table view</option><option value="c">Officers by Center</option></select>
    <input id="q" type="search" placeholder="Search name…">
    <span id="count"></span>
    <span class="sp"></span>
    <button id="ref" type="button" class="plain">Refresh</button>
    <button id="csv" type="button">Download CSV</button>
    <button id="xls" type="button">Download Excel</button>
    <button id="zip" type="button">Download Photos (ZIP)</button>
    <button id="selbtn" type="button" class="plain">Select all shown</button>
    <button id="delsel" type="button" class="del" hidden>Delete selected (0)</button>
    <button id="delall" type="button" class="del">Delete all</button>
    <button id="out" type="button" class="plain">Log out</button>
  </div>
  <div id="oc" hidden></div>
  <div class="wrap" id="tw">
    <table>
      <thead><tr><th>Select</th><th>Photo</th><th>Name</th><th>Category</th><th>Civil status</th><th>Center</th><th>Age</th><th>Position</th><th>Spiritual gift</th><th>Registered</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>
</main>

<dialog id="dlg">
  <form id="ef">
    <h2 style="margin:0 0 4px;font-size:1.2rem">Edit member</h2>
    <label for="e_first">First name</label><input id="e_first" required maxlength="60">
    <label for="e_mid">Middle name</label><input id="e_mid" maxlength="60">
    <label for="e_last">Last name (with suffix)</label><input id="e_last" required maxlength="70">
    <label for="e_dob">Date of birth</label><input id="e_dob" type="date">
    <label for="e_gender">Gender</label><select id="e_gender"></select>
    <label for="e_civil">Civil status</label><select id="e_civil"></select>
    <label for="e_cat">Category</label><select id="e_cat"></select>
    <label for="e_center">Center</label><select id="e_center" required></select>
    <label for="e_age">Age</label><input id="e_age" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" required>
    <label for="e_pos">Position</label><input id="e_pos" maxlength="80">
    <label for="e_gift">Spiritual gift</label><input id="e_gift" maxlength="80">
    <label for="e_phone">Contact number</label><input id="e_phone" maxlength="20">
    <label for="e_email">Email</label><input id="e_email" type="email" maxlength="120">
    <label for="e_addr">Address</label><input id="e_addr" maxlength="200">
    <label class="chk"><input id="e_off" type="checkbox" style="width:auto"> Area 4 Officer</label>
    <div id="e_ofs" hidden>
      <small>The Center above is the assigned center.</small>
      <fieldset class="lv"><legend>Officer type</legend>
        <label class="chk"><input id="e_lv_area" type="checkbox" style="width:auto"> Area Officer</label>
        <label class="chk"><input id="e_lv_local" type="checkbox" style="width:auto"> Local Officer</label>
        <label class="chk"><input id="e_lv_both" type="checkbox" style="width:auto"> Both</label>
      </fieldset>
      <label for="e_opos">Officer position</label><select id="e_opos"></select>
      <input id="e_opos_o" maxlength="60" placeholder="Type the position" aria-label="Other position" hidden style="margin-top:6px">
      <label for="e_term">Term</label><select id="e_term"></select>
      <label for="e_com">Committee / role</label><input id="e_com" maxlength="120">
    </div>
    <label for="e_photo">Photo</label>
    <img id="e_prev" alt="Current photo" hidden>
    <input id="e_photo" type="file" accept="image/*">
    <small>Leave empty to keep the current photo. Any size is fine; it is resized automatically.</small>
    <div id="eerr" class="err" role="alert"></div>
    <div class="btns">
      <button id="esave" type="submit">Save changes</button>
      <button id="ecancel" type="button" class="plain">Cancel</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const CFG = window.APP_CONFIG || {};
if (!CFG.url || CFG.url.includes("YOUR-")) document.body.insertAdjacentHTML("afterbegin", '<p style="padding:12px;color:#b3261e;font-weight:bold">Setup incomplete: open config.js and paste your Supabase URL and key.</p>');
const db = supabase.createClient(CFG.url || "https://invalid.invalid", CFG.key || "x");
const $ = id => document.getElementById(id);
const CENTERS = ["Puon ti Biag","Damasco","Ti libro a naselloan","Eufrates","Baro Jerusalem","Pergamo","Patmos","Raniag ti lawag","Galilea","Tesalonica","Galacia","Baro a langit","Getsemani"];
CENTERS.forEach(c => { $("fc").add(new Option(c, c)); $("e_center").add(new Option(c, c)); });
const CIVIL = ["Single","Married","Separated","Widow (Woman)","Widower (Man)"];
const CATS = ["Junior FYS","Senior FYS","Katandaan"];
const POS = ["President","Vice President","Secretary","Treasurer","Auditor","P.R.O.","Board Member"];
[["e_gender",["Male","Female"]],["e_civil",CIVIL],["e_cat",CATS],["e_opos",POS]].forEach(([id, a]) => { $(id).add(new Option("—", "")); a.forEach(v => $(id).add(new Option(v, v))); });
CATS.forEach(c => $("fcat").add(new Option(c, c))); POS.forEach(c => $("fpos").add(new Option(c, c)));
$("fpos").add(new Option("Others", "__other"));
$("e_opos").add(new Option("Others (type below)", "__other"));
$("e_opos").onchange = () => { $("e_opos_o").hidden = $("e_opos").value !== "__other"; };
const rank = p => POS.includes(p) ? POS.indexOf(p) : 99;
$("e_off").onchange = () => { $("e_ofs").hidden = !$("e_off").checked; };
$("e_lv_both").onchange = () => { $("e_lv_area").checked = $("e_lv_local").checked = $("e_lv_both").checked; };
$("e_lv_area").onchange = $("e_lv_local").onchange = () => { $("e_lv_both").checked = $("e_lv_area").checked && $("e_lv_local").checked; };
// Fixed terms (label, start, end). Add a line here for a future term.
const TERMS = [["2026\u20132028", "2026-01-01", "2028-12-31"]];
const yr = d => (d || "").slice(0, 4);
const termLabel = o => o && o.term_start ? yr(o.term_start) + "\u2013" + yr(o.term_end) : "";
const ended = o => !!(o && o.term_end && o.term_end < new Date().toISOString().slice(0, 10));
function offType(m){ const s = new Set((m.offs || []).map(o => o.officer_level || "Area")); return s.size > 1 ? "Both" : ([...s][0] || ""); }
function fillTerms(o){
  const s = $("e_term"); s.innerHTML = "";
  TERMS.forEach(([l, a, b]) => s.add(new Option(l, a + "|" + b)));
  if (o && o.term_start && !TERMS.some(t => t[1] === o.term_start && t[2] === o.term_end)) {   // keep an older/other saved term selectable
    const v = o.term_start + "|" + (o.term_end || ""); s.add(new Option((termLabel(o) || o.term_start) + " (saved)", v)); s.value = v;
  }
}
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2);
function compress(file){ // same as the public forms: ~900px JPEG, so big phone photos always fit
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(u);
      const k = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("compress")), "image/jpeg", 0.85); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("unreadable")); };
    img.src = u;
  });
}
let prevUrl = null;
$("e_photo").addEventListener("change", () => {
  if (prevUrl) { URL.revokeObjectURL(prevUrl); prevUrl = null; }
  const f = $("e_photo").files[0], cur = editing && urls[editing.photo_path];
  if (f) prevUrl = URL.createObjectURL(f);
  const src = prevUrl || cur || ""; $("e_prev").src = src; $("e_prev").hidden = !src;
});
function ageOf(dob){ const d = new Date(dob + "T00:00:00"), n = new Date(); if (!dob || isNaN(d) || d > n) return null;
  let a = n.getFullYear() - d.getFullYear(); if (n.getMonth() < d.getMonth() || (n.getMonth() === d.getMonth() && n.getDate() < d.getDate())) a--; return a; }
// Age is stored at registration and goes stale, so show it from the birth date when we have one
const curAge = m => (m.date_of_birth && ageOf(m.date_of_birth) != null) ? ageOf(m.date_of_birth) : m.age;
// Marriage/widowhood override: a non-Single person under 30 recorded as Katandaan
function override(m){ return m.civil_status && m.civil_status !== "Single" && m.category === "Katandaan" && curAge(m) != null && curAge(m) < 30
  ? `<small class="pill">${m.civil_status === "Married" ? "married override" : "marital status override"}</small>` : ""; }
let all = [], urls = {}, editing = null;

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function setSel(sel, val){
  if (val && ![...sel.options].some(o => o.value === val)) sel.add(new Option(val, val));
  sel.value = val || "";
}

async function load(){
  $("count").textContent = "Loading…";
  try {
    let rows = [], from = 0;
    while (true) {
      const r = await db.from("members").select("*").order("created_at", {ascending:false}).range(from, from + 999);
      if (r.error) {
        if (/jwt|token|auth/i.test(r.error.message)) { show(false); $("lerr").textContent = "Session expired. Please log in again."; return; }
        throw r.error;
      }
      rows = rows.concat(r.data);
      if (r.data.length < 1000) break;
      from += 1000;
    }
    all = rows; urls = {};
    [...sel].forEach(id => { if (!all.some(m => m.id === id)) sel.delete(id); });
    const o = await db.from("area4_officers").select("*").order("term_start", {ascending:false});
    const byId = {}; all.forEach(m => { m.off = null; m.offs = []; byId[m.id] = m; });
    (o.data || []).forEach(x => { if (byId[x.member_id]) byId[x.member_id].offs.push(x); });
    all.forEach(m => m.off = m.offs[0] || null);   // newest term = the one shown in the table/exports
    const paths = all.map(m => m.photo_path).filter(Boolean);
    for (let i = 0; i < paths.length; i += 100) {
      const s = await db.storage.from("member-photos").createSignedUrls(paths.slice(i, i + 100), 3600);
      (s.data || []).forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; });
    }
    render();
  } catch (err) {
    console.error(err);
    $("count").textContent = "Could not load. Check your internet, then refresh.";
  }
}

// Every export uses filtered(), so exports always respect Type/Category/Position/Center/search
function filtered(){
  const c = $("fc").value, q = $("q").value.trim().toLowerCase(), t = $("ft").value, g = $("fcat").value, p = $("fpos").value;
  return all.filter(m => (!c || m.center === c) && (!q || (m.full_name || "").toLowerCase().includes(q))
    && (!t || (t === "o") === !!m.is_officer) && (!g || m.category === g) && (!p || (m.off && (p === "__other" ? !POS.includes(m.off.position) : m.off.position === p))));
}

function render(){
  const oc = $("fv").value === "c", list = oc ? filtered().filter(m => m.off) : filtered();
  $("count").textContent = list.length + (oc ? " officer" : " member") + (list.length === 1 ? "" : "s") + (!oc && list.length !== all.length ? " (of " + all.length + " total)" : "");
  { const n = filtered().length; $("delall").textContent = n === all.length ? "Delete all" : "Delete shown (" + n + ")"; } updSel();
  $("tw").hidden = oc; $("oc").hidden = !oc;
  if (oc) return renderOfficers(list);
  $("rows").innerHTML = list.length ? list.map(m => `<tr>
    <td class="sel" data-label="Select"><input type="checkbox" data-sel="${m.id}" ${sel.has(m.id) ? "checked" : ""} aria-label="Select ${esc(m.full_name)}"></td>
    <td class="ph">${urls[m.photo_path] ? `<a href="${urls[m.photo_path]}" target="_blank" rel="noopener"><img loading="lazy" src="${urls[m.photo_path]}" alt="Photo of ${esc(m.full_name)}"></a>` : '<span class="nophoto">No photo</span>'}</td>
    <td data-label="Name">${esc(m.full_name)}${m.is_officer ? '<span class="badge">Officer</span>' : ""}</td>
    <td data-label="Category">${esc(m.category)}${override(m)}</td><td data-label="Civil status">${esc(m.civil_status)}</td>
    <td data-label="Center">${esc(m.center)}</td>
    <td data-label="Age">${curAge(m) ?? ""}</td>
    <td data-label="Position">${esc(posOf(m))}</td><td data-label="Spiritual gift">${esc(giftOf(m))}</td>
    <td data-label="Registered">${new Date(m.created_at).toLocaleDateString()}</td>
    <td class="act"><button type="button" class="plain sm" data-act="edit" data-id="${m.id}">Edit</button>
      <button type="button" class="del sm" data-act="del" data-id="${m.id}">Delete</button></td></tr>`).join("")
    : '<tr><td colspan="11">No members found.</td></tr>';
}
function renderOfficers(list){
  const g = {};
  list.forEach(m => m.offs.forEach(o => { const c = o.center || m.center; (g[c] = g[c] || []).push({m, o}); }));
  const cs = Object.keys(g).sort();
  $("oc").innerHTML = cs.length ? cs.map(c => `<h2>${esc(c)}</h2><ul>` + g[c].sort((a, b) => rank(a.o.position) - rank(b.o.position) || (a.o.officer_level || "").localeCompare(b.o.officer_level || ""))
    .map(({m, o}) => `<li><b>${esc(o.position)}</b> — ${esc(m.full_name)} <small>(${esc(o.officer_level || "Area")} officer${termLabel(o) ? ", " + termLabel(o) : ""}${ended(o) ? ", term ended" : ""})</small></li>`).join("") + "</ul>").join("")
    : "<p>No officers found.</p>";
}

$("rows").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const m = all.find(x => x.id === b.dataset.id); if (!m) return;
  if (b.dataset.act === "edit") openEdit(m); else removeMember(m);
});

async function removeMember(m){
  if (!confirm("Delete " + m.full_name + "?\nThis also removes the photo and cannot be undone.")) return;
  const r = await db.from("members").delete().eq("id", m.id).select();
  if (r.error || !r.data.length) { alert("Could not delete: " + (r.error ? r.error.message : "not allowed. Run add-edit-delete.sql in Supabase.")); return; }
  if (m.photo_path) await db.storage.from("member-photos").remove([m.photo_path]);
  await load();
}

function openEdit(m){
  editing = m; $("eerr").textContent = ""; $("e_photo").value = "";
  const p = (m.full_name || "").split(" "), o = m.off || {};
  $("e_first").value = m.first_name ?? p[0] ?? ""; $("e_mid").value = m.middle_name || ""; $("e_last").value = m.last_name ?? p.slice(1).join(" ");
  $("e_dob").value = m.date_of_birth || ""; setSel($("e_gender"), m.gender); setSel($("e_civil"), m.civil_status); setSel($("e_cat"), m.category);
  setSel($("e_center"), m.center);
  $("e_age").value = curAge(m) ?? ""; $("e_pos").value = posOf(m); $("e_gift").value = m.spiritual_gift || "";
  $("e_phone").value = m.contact_number || ""; $("e_email").value = m.email || ""; $("e_addr").value = m.address || "";
  $("e_off").checked = !!m.is_officer; $("e_ofs").hidden = !m.is_officer;
  const custom = o.position && !POS.includes(o.position); setSel($("e_opos"), custom ? "__other" : o.position); $("e_opos_o").value = custom ? o.position : ""; $("e_opos_o").hidden = !custom;
  const lvs = new Set((m.offs || []).map(x => x.officer_level || "Area"));
  $("e_lv_area").checked = lvs.has("Area"); $("e_lv_local").checked = lvs.has("Local"); $("e_lv_both").checked = lvs.size > 1;
  fillTerms(o); $("e_com").value = o.committee || "";
  if (prevUrl) { URL.revokeObjectURL(prevUrl); prevUrl = null; }
  $("e_prev").src = urls[m.photo_path] || ""; $("e_prev").hidden = !urls[m.photo_path];
  $("dlg").showModal();
}
$("e_age").addEventListener("input", () => { $("e_age").value = $("e_age").value.replace(/\D/g, "").slice(0, 3); });
$("e_dob").addEventListener("change", () => { const a = ageOf($("e_dob").value); if (a != null) $("e_age").value = a; });
$("ecancel").onclick = () => $("dlg").close();

$("ef").addEventListener("submit", async e => {
  e.preventDefault(); $("esave").disabled = true; $("eerr").textContent = "";
  let newPath = null;
  try {
    const dob = $("e_dob").value || null; let ageNum = parseInt($("e_age").value, 10);
    if (dob && ageOf(dob) != null) ageNum = ageOf(dob);
    if (!(ageNum >= 1 && ageNum <= 120)) throw new Error("Please enter a valid age (1 to 120).");
    const first = $("e_first").value.trim(), mid = $("e_mid").value.trim(), last = $("e_last").value.trim();
    if (!first || !last) throw new Error("First and last name are required.");
    const isOff = $("e_off").checked, center = $("e_center").value;
    const levels = [$("e_lv_area").checked && "Area", $("e_lv_local").checked && "Local"].filter(Boolean);
    const opos = $("e_opos").value === "__other" ? $("e_opos_o").value.trim().replace(/\s+/g, " ") : $("e_opos").value;
    if (isOff && !levels.length) throw new Error("Choose Area Officer, Local Officer or Both.");
    if (isOff && (!opos || !$("e_term").value)) throw new Error("Officers need a position and a term.");
    const mine = editing.offs || [];
    // Upload the new photo first (resized to ~900px JPEG); if anything later fails it is removed again
    let photo_path = editing.photo_path, oldPath = null;
    const file = $("e_photo").files[0];
    if (file) {
      let blob; try { blob = await compress(file); } catch (_) { throw new Error("This photo could not be read. Please choose a JPG, PNG or WebP image."); }
      const np = uid() + ".jpg";
      const up = await db.storage.from("member-photos").upload(np, blob, {contentType: "image/jpeg"});
      if (up.error) throw new Error("Photo upload failed: " + up.error.message);
      newPath = np; oldPath = editing.photo_path; photo_path = np;
    }
    // Officer rows (one per level) before the member row, so a duplicate-position error stops the save early
    if (isOff) {
      const [ts, te] = $("e_term").value.split("|");
      const base = {center, position: opos, term_start: ts || null, term_end: te || null, committee: $("e_com").value.trim() || null};
      for (const lv of levels) {
        const ex = mine.find(x => (x.officer_level || "Area") === lv);
        const r = await (ex ? db.from("area4_officers").update({...base, officer_level: lv}).eq("id", ex.id).select()
                            : db.from("area4_officers").insert({...base, officer_level: lv, member_id: editing.id}).select());
        if (r.error) throw new Error(r.error.code === "23505" ? "Another " + opos + " is already registered at " + center + " for this term (" + lv + " officer)." : r.error.message);
        if (!r.data.length) throw new Error("Officer record was not saved (not allowed). Run migration.sql in Supabase.");
      }
      const drop = mine.filter(x => !levels.includes(x.officer_level || "Area")).map(x => x.id);
      if (drop.length) { const r = await db.from("area4_officers").delete().in("id", drop); if (r.error) throw r.error; }
    } else if (mine.length) {
      const r = await db.from("area4_officers").delete().eq("member_id", editing.id); if (r.error) throw r.error;
    }
    const r = await db.from("members").update({
      first_name: first, middle_name: mid || null, last_name: last, full_name: [first, mid, last].filter(Boolean).join(" "),
      date_of_birth: dob, gender: $("e_gender").value || null, civil_status: $("e_civil").value || null, category: $("e_cat").value || null,
      center, age: ageNum, is_officer: isOff,
      // un-ticking Officer must not leave the old officer title (e.g. "President") in the member record
      position: isOff ? opos : (editing.is_officer && $("e_pos").value.trim() === posOf(editing) ? "Member" : ($("e_pos").value.trim() || "Member")),
      spiritual_gift: $("e_gift").value.trim() || "None", contact_number: $("e_phone").value.trim() || null,
      email: $("e_email").value.trim() || null, address: $("e_addr").value.trim() || null, photo_path
    }).eq("id", editing.id).select();
    if (r.error) throw new Error(r.error.code === "23505" ? "Another member with the same name and email already exists." : r.error.message);
    if (!r.data.length) throw new Error("Not allowed. Run add-edit-delete.sql in Supabase.");
    newPath = null;                                   // saved: keep the new photo
    if (oldPath) await db.storage.from("member-photos").remove([oldPath]);
    $("dlg").close(); await load();
  } catch (err) {
    if (newPath) db.storage.from("member-photos").remove([newPath]).catch(() => {});
    $("eerr").textContent = "Could not save: " + (err.message || err);
  }
  finally { $("esave").disabled = false; }
});

function safe(s){ return String(s || "").replace(/[\\/:*?"<>|\x00-\x1f]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 80) || "member"; }
function posOf(m){ return m.position && m.position.trim() && m.position.trim().toLowerCase() !== "none" ? m.position : "Member"; }
function giftOf(m){ return m.spiritual_gift && m.spiritual_gift.trim() ? m.spiritual_gift : "None"; }
function sorted(list){ return [...list].sort((a, b) => (a.center || "").localeCompare(b.center || "") || (a.full_name || "").localeCompare(b.full_name || "")); }
function photoNames(){          // member id -> "Center/Full Name.jpg" (unique)
  const used = new Set(), out = {};
  sorted(all).forEach(m => {
    if (!m.photo_path) return;
    const ext = (m.photo_path.split(".").pop() || "jpg").toLowerCase();
    const base = safe(m.center) + "/" + safe(m.full_name);
    let n = base + "." + ext, i = 2;
    while (used.has(n.toLowerCase())) n = base + " (" + (i++) + ")." + ext;
    used.add(n.toLowerCase()); out[m.id] = n;
  });
  return out;
}
function csvCell(v){
  v = v == null ? "" : String(v);
  if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;
  return '"' + v.replace(/"/g, '""') + '"';
}
function tableData(list, names){
  const head = ["No.","Full Name","First Name","Middle Name","Last Name","Date of Birth","Gender","Civil Status","Category","Category Note","Officer","Officer Position","Officer Type","Center","Term Start","Term End","Committee","Age","Position","Spiritual Gift","Contact","Email","Address","Date Registered","Photo File"];
  const fmt = {year:"numeric", month:"short", day:"2-digit", hour:"numeric", minute:"2-digit"};
  const rows = sorted(list).map((m, i) => { const o = m.off || {}; return [i + 1, m.full_name, m.first_name, m.middle_name, m.last_name, m.date_of_birth, m.gender, m.civil_status, m.category,
    override(m) ? (m.civil_status === "Married" ? "married override" : "marital status override") : "", m.is_officer ? "Yes" : "No", o.position, offType(m), m.center, o.term_start, o.term_end, o.committee,
    curAge(m), posOf(m), giftOf(m), m.contact_number, m.email, m.address, new Date(m.created_at).toLocaleString("en-US", fmt), names[m.id] || "No photo"]; });
  return [head, ...rows];
}
function csvText(list, names){ return "\ufeff" + tableData(list, names).map(r => r.map(csvCell).join(",")).join("\r\n"); }
// Excel: an HTML table saved as .xls opens natively in Excel/LibreOffice (no external library needed)
function xlsText(list, names){
  const cell = v => { v = v == null ? "" : String(v); return "<td>" + esc(/^[=+\-@\t\r]/.test(v) ? "'" + v : v) + "</td>"; };
  return '<html><head><meta charset="utf-8"></head><body><table border="1">' + tableData(list, names).map(r => "<tr>" + r.map(cell).join("") + "</tr>").join("") + "</table></body></html>";
}
function saveBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
$("csv").onclick = () => saveBlob(new Blob([csvText(filtered(), photoNames())], {type:"text/csv;charset=utf-8"}), "members-" + stamp() + ".csv");

$("zip").onclick = async () => {
  if (!window.JSZip) return alert("The ZIP tool could not load. Check your internet and refresh.");
  const list = filtered(), names = photoNames(), todo = list.filter(m => urls[m.photo_path] && names[m.id]);
  if (!todo.length) return alert("There are no photos in this list.");
  const btn = $("zip"), label = btn.textContent; btn.disabled = true;
  try {
    const zip = new JSZip(), queue = [...todo]; let done = 0, failed = 0;
    const worker = async () => {
      while (queue.length) {
        const m = queue.shift();
        try { const r = await fetch(urls[m.photo_path]); if (!r.ok) throw new Error("http"); zip.file(names[m.id], await r.blob()); }
        catch (_) { failed++; }
        btn.textContent = "Photos " + (++done) + "/" + todo.length;
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    btn.textContent = "Zipping…";
    zip.file("members.csv", csvText(list, names));
    saveBlob(await zip.generateAsync({type:"blob", compression:"STORE"}), "members-photos-" + stamp() + ".zip");
    if (failed) alert(failed + " photo(s) could not be downloaded. Refresh the page and try again.");
  } catch (err) { console.error(err); alert("Could not create the ZIP. Check your internet and try again."); }
  finally { btn.disabled = false; btn.textContent = label; }
};

$("showpw").onchange = () => { $("pass").type = $("showpw").checked ? "text" : "password"; };
function show(signedIn){ if (!signedIn) { $("showpw").checked = false; $("pass").type = "password"; $("pass").value = ""; }
  $("login").hidden = signedIn; $("panel").hidden = !signedIn; if (signedIn) load(); }
$("login").addEventListener("submit", async e => {
  e.preventDefault(); $("lerr").textContent = "";
  const r = await db.auth.signInWithPassword({email:$("email").value, password:$("pass").value});
  if (r.error) $("lerr").textContent = "Login failed: " + r.error.message; else show(true);
});
$("out").onclick = async () => { await db.auth.signOut(); show(false); };
$("ref").onclick = load;
// SELECTIVE DELETE: tick the rows you want. Only selected rows that are still visible under the current
// filters are ever deleted, so hidden rows can never be removed by accident.
const sel = new Set();
const selected = () => filtered().filter(m => sel.has(m.id));
function updSel(){
  const oc = $("fv").value === "c", n = selected().length, shown = filtered().length;
  $("delsel").hidden = oc || !n; $("delsel").textContent = "Delete selected (" + n + ")";
  $("selbtn").hidden = oc; $("selbtn").textContent = n && n === shown ? "Clear selection" : "Select all shown";
}
$("rows").addEventListener("change", e => {
  const c = e.target.closest("input[data-sel]"); if (!c) return;
  c.checked ? sel.add(c.dataset.sel) : sel.delete(c.dataset.sel); updSel();
});
$("selbtn").onclick = () => { const f = filtered(); if (selected().length === f.length) f.forEach(m => sel.delete(m.id)); else f.forEach(m => sel.add(m.id)); render(); };

// Shared by "Delete all/shown" and "Delete selected": confirm + type DELETE + automatic CSV backup, then
// delete in batches of 50 with their photos (officer rows go automatically via ON DELETE CASCADE).
async function deleteMembers(list, scope, btn){
  if (!confirm("You are about to PERMANENTLY delete " + scope + " and their photos.\nThis cannot be undone.\n\nA CSV backup will download first. Continue?")) return;
  if ((prompt("Type DELETE (capital letters) to confirm.") || "").trim() !== "DELETE") return alert("Cancelled. Nothing was deleted.");
  const label = btn.textContent; btn.disabled = true; let done = 0;
  try {
    saveBlob(new Blob([csvText(list, photoNames())], {type:"text/csv;charset=utf-8"}), "backup-before-delete-" + stamp() + ".csv");
    await new Promise(r => setTimeout(r, 1500));            // let the backup download start
    const ids = list.map(m => m.id);
    for (let i = 0; i < ids.length; i += 50) {
      const r = await db.from("members").delete().in("id", ids.slice(i, i + 50)).select("id,photo_path");
      if (r.error) throw r.error;
      const paths = (r.data || []).map(x => x.photo_path).filter(Boolean);
      if (paths.length) await db.storage.from("member-photos").remove(paths);
      done += (r.data || []).length; btn.textContent = "Deleting " + done + "/" + ids.length;
    }
    alert("Deleted " + done + " member" + (done === 1 ? "" : "s") + ". A backup CSV was downloaded.");
  } catch (err) {
    console.error(err);
    alert("Stopped after deleting " + done + " of " + list.length + ". Check your internet and your admin login, then refresh.");
  } finally { btn.disabled = false; btn.textContent = label; await load(); }
}
$("delall").onclick = () => {
  const l = filtered(); if (!l.length) return alert("There is nothing to delete.");
  deleteMembers(l, l.length === all.length ? "ALL " + all.length + " members" : l.length + " members shown by the current filters (out of " + all.length + " total)", $("delall"));
};
$("delsel").onclick = () => {
  const l = selected(); if (!l.length) return;
  deleteMembers(l, l.length + " selected member" + (l.length === 1 ? "" : "s"), $("delsel"));
};
["fc","ft","fcat","fpos","fv"].forEach(id => $(id).onchange = render); $("q").oninput = render;
$("xls").onclick = () => saveBlob(new Blob([xlsText(filtered(), photoNames())], {type:"application/vnd.ms-excel"}), "members-" + stamp() + ".xls");
db.auth.getSession().then(r => show(!!r.data.session));
</script>
